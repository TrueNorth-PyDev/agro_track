# railway.toml — AgroTrack Deployment Configuration
# Docs: https://docs.railway.com/reference/config-as-code
# Schema: https://railway.com/railway.schema.json

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
# Must serve the ASGI app (not WSGI) so WebSocket upgrade requests
# (ws/chat/orders/{id}/, ws/notifications/) work in production.
startCommand = "daphne -b 0.0.0.0 -p $PORT agrotrack.asgi:application"
preDeployCommand = ["python manage.py migrate --noinput"]
healthcheckPath = "/api/schema/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
